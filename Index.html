<!-- Include Google's 3D Model Viewer Script in your <head> -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<div class="gallery">
  
  <!-- Slice 1 (Repeat this 10 times in your actual code) -->
  <div class="slice">
    <!-- BEFORE HOVER: Image & Text -->
    <div class="content-normal" style="background-image: url('your-image-1.jpg');">
      <div class="text-box">
        <h3>Slice Title 1</h3>
      </div>
    </div>
    
    <!-- AFTER HOVER: 3D GLB Container -->
    <div class="content-glb">
      <model-viewer 
        src="your-3d-model-1.glb" 
        camera-controls 
        auto-rotate>
      </model-viewer>
    </div>
  </div>
  
  <!-- Slice 2 -->
  <div class="slice">
    <div class="content-normal" style="background-image: url('your-image-2.jpg');">
      <div class="text-box">
        <h3>Slice Title 2</h3>
      </div>
    </div>
    <div class="content-glb">
      <model-viewer src="your-3d-model-2.glb" camera-controls auto-rotate></model-viewer>
    </div>
  </div>

  <!-- ... (Add Slices 3 through 10 following the same pattern) ... -->

</div>
